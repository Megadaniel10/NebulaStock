<!DOCTYPE html>
<html lang="it">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { nebula: { 700: '#1e293b', 800: '#0f172a', 900: '#0b0f19', 950: '#05070e', border: 'rgba(255, 255, 255, 0.08)' } } } } }
